name: Validate Google Play account switcher
on:
  push:
    branches:
      - feature/google-play-account-switcher
      - feature/google-play-resilience
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - name: Verify Android SDK
        run: |
          command -v sdkmanager
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
      - name: Compile and test debug APK
        run: |
          chmod +x gradlew
          tasks=(:app:assembleDebug)
          if [[ -d app/src/test || -d app/src/testDebug ]]; then
            tasks+=(:app:testDebugUnitTest)
          else
            echo '::notice::No debug unit test sources configured.'
          fi
          ./gradlew --no-daemon --stacktrace "${tasks[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: Umbra-google-play-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
