name: Manual Build Umbra APK

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select Release Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug_tag

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false 

      - name: Extract Version Code
        id: extract_version
        run: |
          VERSION_CODE=$(grep -m 1 'versionCode' app/build.gradle.kts | tr -dc '0-9')
          if [ -z "$VERSION_CODE" ]; then
            echo "Error: Could not extract version code!"
            exit 1
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          
          # Logic for Tag and Pre-release status
          if [ "${{ github.event.inputs.release_type }}" == "debug_tag" ]; then
            echo "TAG_NAME=v${VERSION_CODE}-debug" >> $GITHUB_ENV
            echo "RELEASE_NAME=Umbra Debug Preview v${VERSION_CODE}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v${VERSION_CODE}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Umbra Release v${VERSION_CODE}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_KEYSTORE | base64 --decode > app/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Always Release Optimized)
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          TARGET_NAME="Umbra-${{ env.TAG_NAME }}.apk"
          mv "$APK_PATH" "app/build/outputs/apk/release/$TARGET_NAME"
          echo "APK_FINAL_PATH=app/build/outputs/apk/release/$TARGET_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body: |
            Automated build generated via Manual Workflow.
            
            - **Build Configuration:** Release (Signed & Optimized)
            - **Version Code:** ${{ env.VERSION_CODE }}
            - **Release Type:** ${{ github.event.inputs.release_type }}
            - **Status:** ${{ env.IS_PRERELEASE == 'true' && 'Experimental/Debug' || 'Stable Production' }}
            
          files: ${{ env.APK_FINAL_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}