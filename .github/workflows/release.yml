name: 🚀 Build & Release Umbra

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: '📦 Select Release Channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - pre-release
          - debug

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -XX:+HeapDumpOnOutOfMemoryError' -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build-and-release:
    name: 🔨 Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevent hanging workflows

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for auto-generating release notes

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle (Optimized v4 Caching with zstd)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write to cache if building from the main branch. Other branches will only read.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Automatically delete unused dependencies and daemon logs before saving cache
          cache-cleanup: always

      - name: 🏷️ Extract Version Information
        id: extract_version
        run: |
          VERSION_CODE=$(grep -m 1 'versionCode\s*=\s*' app/build.gradle.kts | grep -o '[0-9]\+')
          VERSION_NAME=$(grep -m 1 'versionName\s*=\s*' app/build.gradle.kts | cut -d'"' -f2)
          
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "❌ Error: Could not extract version info!"
            exit 1
          fi
          
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          
          if [ "${{ github.event.inputs.release_type }}" == "stable" ]; then
            echo "TAG_NAME=v${VERSION_NAME}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Umbra v${VERSION_NAME} (Stable)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.release_type }}" == "pre-release" ]; then
            echo "TAG_NAME=v${VERSION_NAME}-rc" >> $GITHUB_ENV
            echo "RELEASE_NAME=Umbra v${VERSION_NAME} (Release Candidate)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v${VERSION_NAME}-debug" >> $GITHUB_ENV
            echo "RELEASE_NAME=Umbra v${VERSION_NAME} (Debug Preview)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: 🔐 Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 --decode > app/keystore.jks

      - name: 🛠️ Build Optimized APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🧹 Secure Keystore Cleanup
        if: always() # Ensure this runs even if the build fails
        run: rm -f app/keystore.jks

      - name: 📦 Locate and Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Error: Release APK not found!"
            exit 1
          fi
          
          TARGET_NAME="Umbra-${{ env.TAG_NAME }}.apk"
          mv "$APK_PATH" "$TARGET_NAME"
          echo "APK_FINAL_PATH=$TARGET_NAME" >> $GITHUB_ENV

      - name: 📤 Upload Artifact (Actions Panel)
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-APK-${{ env.TAG_NAME }}
          path: ${{ env.APK_FINAL_PATH }}
          retention-days: 14 # Keep artifact for 14 days in the Actions tab
          compression-level: 0 # Zstd compression is handled dynamically; 0 saves CPU time on already compressed APKs

      - name: 🎉 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true # Automatically append git commit history
          body: |
            ### 🚀 Umbra Automated Release
            
            - **Version:** ${{ env.VERSION_NAME }} (Code: ${{ env.VERSION_CODE }})
            - **Channel:** ${{ github.event.inputs.release_type }}
            - **Build Configuration:** R8 Optimized, Obfuscated & Signed
            
            > **Note:** Please ensure you have the latest version of LSPosed installed before updating.
          files: ${{ env.APK_FINAL_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}