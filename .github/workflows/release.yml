name: 🚀 Build & Release Umbra

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: '📦 Select Release Channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - pre-release
          - debug

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -XX:+HeapDumpOnOutOfMemoryError' -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build-and-release:
    name: 🔨 Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: always

      - name: 🏷️ Extract Version Information
        id: extract_version
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            BASE_VERSION="$(sed -n 's/^umbraVersionName=//p' gradle.properties | head -n 1)"
            case "$RELEASE_TYPE" in
              stable) TAG_NAME="v${BASE_VERSION}" ;;
              pre-release) TAG_NAME="v${BASE_VERSION}-rc" ;;
              debug) TAG_NAME="v${BASE_VERSION}-debug" ;;
              *) echo "Unsupported release type: $RELEASE_TYPE" >&2; exit 1 ;;
            esac
          fi

          python3 scripts/version_from_tag.py "$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: 🔐 Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 --decode > app/keystore.jks

      - name: 🛠️ Build Optimized APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ steps.extract_version.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.extract_version.outputs.version_code }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            "-PumbraVersionName=$RELEASE_VERSION_NAME" \
            "-PumbraVersionCode=$RELEASE_VERSION_CODE"

      - name: 🧹 Secure Keystore Cleanup
        if: always()
        run: rm -f app/keystore.jks

      - name: 📦 Locate and Rename APK
        id: rename_apk
        env:
          TAG_NAME: ${{ steps.extract_version.outputs.tag_name }}
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "$APK_PATH" ]]; then
            echo "APK not found" >&2
            exit 1
          fi

          TARGET_NAME="Umbra-${TAG_NAME}.apk"
          mv "$APK_PATH" "$TARGET_NAME"
          echo "apk_path=$TARGET_NAME" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload Artifact (Actions Panel)
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-APK-${{ steps.extract_version.outputs.tag_name }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
          retention-days: 14
          compression-level: 0

      - name: 🎉 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.tag_name }}
          name: ${{ steps.extract_version.outputs.release_name }}
          prerelease: ${{ steps.extract_version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ### 🚀 Umbra Automated Release

            - **Version:** ${{ steps.extract_version.outputs.version_name }}
            - **Version code:** ${{ steps.extract_version.outputs.version_code }}
            - **Channel:** ${{ steps.extract_version.outputs.channel }}
            - **Build:** R8 optimized, obfuscated, and signed

            > Please ensure that LSPosed is up to date before installing.
          files: ${{ steps.rename_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
